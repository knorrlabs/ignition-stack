# Sections key on the labels .github/workflows/pr-labels.yml sets from each PR's title; first match wins.

changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: "🔒 Security"
      labels:
        - security

    - title: "🚀 Features"
      labels:
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug

    - title: "📝 Documentation"
      labels:
        - documentation

    - title: "🔧 Maintenance"
      labels:
        - maintenance
        - chore
        - ci
        - test
        - refactor

    - title: "📦 Dependencies"
      labels:
        - dependencies

    - title: "🔄 Other Changes"
      labels:
        - "*"
