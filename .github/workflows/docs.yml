name: docs

# Validates the documentation site (the generated CLI reference must match the
# live Typer command tree, and the site must build with no broken links) and,
# on a push to main, deploys the built site to GitHub Pages.
#
# Pull requests run this workflow unconditionally so its jobs can be required
# checks: a path-filtered workflow never reports on PRs outside its paths, and
# a required check that never reports blocks the PR forever. `changes` decides
# whether the docs jobs have anything to check; when they skip, they count as
# passing.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ignition_stack/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  changes:
    name: docs-changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Detect docs-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main are already path-filtered above.
          if [ -z "$PR" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
              | grep -qE '^(docs/|ignition_stack/|pyproject\.toml$|\.github/workflows/docs\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  cli-reference:
    name: CLI reference drift + page presence
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Drift, coverage, and page-presence checks
        run: uv run --extra dev pytest tests/test_docs_cli_reference.py

  build:
    name: Build site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      # Package the built site for Pages only when we intend to publish it.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cli-reference, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One in-flight publish at a time; let a running deploy finish rather than
    # cancelling it mid-upload.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
